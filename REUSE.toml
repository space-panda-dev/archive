# Which license covers which files (https://reuse.software). Code is
# AGPL-3.0-or-later; everything else is CC0-1.0. See ADR 0017.
# A file that matches nothing here fails `make check`: decide which it is.
# When a file matches both, the later annotation wins (REUSE), so data and
# published schemas under a code directory are listed in the CC0 block.
version = 1
SPDX-PackageName = "Archive"

[[annotations]]
path = [".gitignore", "Makefile", "flake.nix", "flake.lock", "*.cabal", "cabal.project", "scripts/**", "migration/**", "shadow/**", "archive/**", "door/**", "world/*.py", "world/**/*.py", "world/requirements.txt", "world/requirements-test.txt", "relay/*.py", "relay/**/*.py", "fixture/*.py", "fixture/**/*.py", "enrich/*.py", "enrich/**/*.py", "enrich/requirements.txt", "capture/*.py", ".github/**"]
SPDX-FileCopyrightText = "The Archive contributors"
SPDX-License-Identifier = "AGPL-3.0-or-later"

[[annotations]]
path = ["*.md", "docs/**", "spec/**", "world/*.md", "relay/*.md", "enrich/*.md", "capture/*.md", "world/examples/**", "world/tests/fixtures/**", "door/test/fixtures/**", "door/service.schema.json", "relay/openapi.json", "world/projection/**", "fixture/*.md", "fixture/plan.json", "fixture/content/**"]
SPDX-FileCopyrightText = "The Archive contributors"
SPDX-License-Identifier = "CC0-1.0"
