# Archive's CI (ADR 0062): structure checks, every test suite, World's
# conformance, and the release image, which is then started the way a
# client's CI would start it.
name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  structure:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - run: make check

  build-and-test:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      # checks.archive runs `cabal test all`; checks.python runs the World
      # (with conformance), relay, shadow, migration, and fixture suites
      # against that build, failing rather than skipping.
      - run: nix flake check -L
      - run: nix build -L .#image -o image
      - run: nix build -L .#bundle -o bundle
      - name: Start the image as a client's CI would
        run: |
          docker load < image
          docker run -d --name archive --network host archive:latest
          for attempt in $(seq 1 120); do
            if curl -sf -H 'Tailscale-User-Login: ci@example.invalid' http://127.0.0.1:8450/health > health.json; then break; fi
            sleep 2
          done
          python3 -c "import json; h=json.load(open('health.json')); assert h['ok'] and h['archive']['role'] == 'scratch', h"
          docker logs archive
          docker stop archive
