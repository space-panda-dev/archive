# Archive's CI (ADR 0062): every test suite, World's conformance, and the
# release image, which is then started the way a client's CI would start it.
# The structure checks are structure.yml, which runs on every change. A change
# to nothing but the files below cannot change a test's outcome (no test or
# build reads them), so it skips this workflow (ADR 0115).
#
# The prerequisite caches the Haskell package and test runtimes. Independent
# suites and enrichment shards use the same declared matrix as Nix; unittest
# and unittest-parallel execute the tests (ADR 0127).
name: CI

# A branch runs once: as a pull request, or as main after the merge.
on:
  push:
    branches: [main]
    paths-ignore: ["*.md", "docs/decisions/**", ".workshop.toml"]
  pull_request:
    paths-ignore: ["*.md", "docs/decisions/**", ".workshop.toml"]

# A newer push to the same pull request cancels the older run; main keeps
# every run.
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

jobs:
  # The Haskell package (including cabal tests) and shared test runtimes.
  archive:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    outputs:
      tests: ${{ steps.matrix.outputs.tests }}
    permissions:
      contents: read
      actions: write # to purge this branch's superseded caches
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      # Nix still verifies every derivation after a fallback cache restore.
      # The v2 cache roots the test interpreters as well as the package.
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-ci-v2-${{ hashFiles('flake.nix', 'flake.lock', 'archive.cabal', 'cabal.project', 'door/**', 'archive/**', 'spec/**', 'fixture/plan.json') }}
          restore-prefixes-first-match: |
            nix-ci-v2-
            nix-archive-
          # Keep runtime roots; build-only paths can be substituted again.
          gc-max-store-size-linux: 3G
          purge: true
          purge-prefixes: nix-ci-v2-
          purge-created: 0
          purge-primary-key: never
      - name: Declare all test jobs
        id: matrix
        run: echo "tests=$(nix eval --json .#lib.ciChecks)" >> "$GITHUB_OUTPUT"
      - run: nix build -L .#ci-dependencies -o result-ci

  # Every declared suite runs; the matrix is generated from flake.nix so
  # adding or removing an enrichment shard cannot leave a workflow gap.
  tests:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        check: ${{ fromJSON(needs.archive.outputs.tests) }}
    name: tests (${{ matrix.check }})
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-ci-v2-${{ hashFiles('flake.nix', 'flake.lock', 'archive.cabal', 'cabal.project', 'door/**', 'archive/**', 'spec/**', 'fixture/plan.json') }}
          restore-prefixes-first-match: |
            nix-ci-v2-
            nix-archive-
          save: false
      - run: nix build -L .#checks.x86_64-linux.${{ matrix.check }}

  # The release image and bundle, and a start of the image as a client's CI
  # would start it.
  image:
    needs: archive
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - uses: cachix/install-nix-action@448cde739abec1eaf0646249e3d25bb8d9bc7702 # v31
      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-ci-v2-${{ hashFiles('flake.nix', 'flake.lock', 'archive.cabal', 'cabal.project', 'door/**', 'archive/**', 'spec/**', 'fixture/plan.json') }}
          restore-prefixes-first-match: |
            nix-ci-v2-
            nix-archive-
          save: false
      - run: nix build -L .#image -o image
      - run: nix build -L .#bundle -o bundle
      - name: Start the image as a client's CI would
        run: |
          docker load < image
          docker run -d --name archive --network host archive:latest
          for attempt in $(seq 1 120); do
            if curl -sf -H 'Tailscale-User-Login: ci@example.invalid' http://127.0.0.1:8450/health > health.json; then break; fi
            sleep 2
          done
          python3 -c "import json; h=json.load(open('health.json')); assert h['ok'] and h['archive']['role'] == 'scratch', h"
          docker logs archive
          docker stop archive
